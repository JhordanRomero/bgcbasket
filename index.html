    <!-- Scripts -->
    <script>
        // =======================================================================
        // 1. SISTEMA DINÁMICO DE FUENTES PARA DESCARGA DE IMAGEN (Exportación)
        // =======================================================================
        // Convertimos buffer a base64 (Más seguro que FileReader en móviles)
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        async function prepareFontForExport() {
            async function injectFontFromUrl(url) {
                const response = await fetch(url);
                if (!response.ok) throw new Error("No se encontró el archivo woff");
                
                const buffer = await response.arrayBuffer();
                const base64 = arrayBufferToBase64(buffer);
                
                // Inyectamos la fuente SÓLO a los SVGs para que al exportar a imagen, la reconozca
                const fontCSS = `
                    @font-face {
                        font-family: 'Basketball';
                        src: url(data:font/woff;base64,${base64}) format('woff');
                        font-weight: normal;
                        font-style: normal;
                    }
                `;
                document.getElementById('svg-front-style').innerHTML = fontCSS;
                document.getElementById('svg-back-style').innerHTML = fontCSS;
            }

            try {
                // Intento 1: Ruta local (Funciona perfecto en GitHub Pages)
                await injectFontFromUrl('./Basketball.woff');
            } catch (error) {
                console.warn("Fallo carga de tipografía local. Intentando plan de emergencia...");
                try {
                    // Intento 2: Ruta directa "Cruda" desde el repositorio si lo anterior falla
                    await injectFontFromUrl('https://raw.githubusercontent.com/JhordanRomero/bgcbasket/main/Basketball.woff');
                } catch (err2) {
                    console.error("No se pudo cargar la fuente para la exportación de la imagen.", err2);
                }
            }
        }

        // Ejecutar preparación silenciosa al cargar la página
        prepareFontForExport();


        // =======================================================================
        // 2. LÓGICA DE BASE DE DATOS Y ESTADOS
        // =======================================================================
        let SCRIPT_URL = localStorage.getItem('bgc_script_url') || 'https://script.google.com/macros/s/AKfycbzNc7Md5rJmrgYBk_ZDrpmJlq7wk3pciD5Wjl7kV5dCS0Rl3PB0puUJGgz32eNiYyvlUw/exec';
        
        const INITIAL_PLAYERS = [
            { numero: "0", nombre: "easy", confirmado: true },
            { numero: "2", nombre: "sebastian", confirmado: false },
            { numero: "3", nombre: "juanki", confirmado: false },
            { numero: "4", nombre: "Novi Santos", confirmado: false },
            { numero: "5", nombre: "Ruka", confirmado: true },
            { numero: "6", nombre: "Estro", confirmado: true },
            { numero: "7", nombre: "Martín", confirmado: true },
            { numero: "8", nombre: "Fore", confirmado: true },
            { numero: "9", nombre: "face", confirmado: false },
            { numero: "10", nombre: "Mike Milfort", confirmado: false },
            { numero: "11", nombre: "Gato", confirmado: true },
            { numero: "12", nombre: "manu", confirmado: true },
            { numero: "13", nombre: "Kun", confirmado: true },
            { numero: "17", nombre: "jotar", confirmado: true },
            { numero: "23", nombre: "Henry", confirmado: true },
            { numero: "25", nombre: "fiz", confirmado: true },
            { numero: "27", nombre: "Naiz", confirmado: true },
            { numero: "32", nombre: "Facci", confirmado: true },
            { numero: "33", nombre: "shakito", confirmado: true },
            { numero: "420", nombre: "Aka", confirmado: false }
        ];

        let players = [];
        let currentJerseyPlayer = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('script-url-input').value = SCRIPT_URL;
        });

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        function saveScriptUrl() {
            const url = document.getElementById('script-url-input').value.trim();
            if(url) {
                SCRIPT_URL = url;
                localStorage.setItem('bgc_script_url', url);
                toggleSettings();
                loadPlayers();
            }
        }

        function setConnectionStatus(status) {
            const dot = document.getElementById('status-dot');
            if (status === 'loading') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse ml-1";
                dot.title = "Sincronizando con Google Sheets...";
            } else if (status === 'online') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)] ml-1";
                dot.title = "Conectado y Sincronizado";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)] ml-1";
                dot.title = "Error de conexión (Usando datos locales)";
            }
        }

        async function loadPlayers() {
            setConnectionStatus('loading');
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                if (data && Array.isArray(data) && data.length > 0) {
                    players = data;
                    setConnectionStatus('online');
                } else {
                    players = [...INITIAL_PLAYERS];
                    setConnectionStatus('online');
                }
                renderPlayers();
                updateJerseySelect();
            } catch (error) {
                console.error("Error cargando datos:", error);
                setConnectionStatus('error');
                players = [...INITIAL_PLAYERS];
                renderPlayers();
                updateJerseySelect();
            }
        }

        loadPlayers();

        async function runAction(actionName, payload) {
            setConnectionStatus('loading'); 
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: actionName, ...payload })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    setConnectionStatus('online'); 
                } else {
                    console.error("Error desde Apps Script:", result.error);
                    setConnectionStatus('error');
                    alert("Error en el servidor: " + (result.error || "Desconocido"));
                }
            } catch (error) {
                console.error(`Error ejecutando acción [${actionName}]:`, error);
                setConnectionStatus('error');
            }
        }

        function switchTab(tab) {
            document.getElementById('view-payments').classList.toggle('hidden', tab !== 'payments');
            document.getElementById('view-jersey').classList.toggle('hidden', tab !== 'jersey');
            
            document.getElementById('btn-tab-payments').className = tab === 'payments' 
                ? 'px-6 py-1.5 rounded-lg text-[10px] font-bold tracking-widest transition-all bg-white text-gray-900 shadow-sm border border-gray-200' 
                : 'px-6 py-1.5 rounded-lg text-[10px] font-bold tracking-widest transition-all text-gray-500 hover:text-gray-800';
            
            document.getElementById('btn-tab-jersey').className = tab === 'jersey' 
                ? 'px-6 py-1.5 rounded-lg text-[10px] font-bold tracking-widest transition-all bg-white text-gray-900 shadow-sm border border-gray-200' 
                : 'px-6 py-1.5 rounded-lg text-[10px] font-bold tracking-widest transition-all text-gray-500 hover:text-gray-800';
        }

        function renderPlayers() {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            
            document.getElementById('stat-total').innerText = players.length;
            document.getElementById('stat-confirmed').innerText = players.filter(p => p.confirmado).length;
            document.getElementById('stat-pending').innerText = players.filter(p => !p.confirmado).length;

            players.sort((a,b) => Number(a.numero) - Number(b.numero)).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'p-3 flex items-center justify-between hover:bg-gray-50 transition-colors';
                const safeName = p.nombre || 'SIN NOMBRE';
                row.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center border border-slate-200 font-black text-slate-700 text-sm">${p.numero}</div>
                        <div>
                            <p class="font-bold text-sm text-gray-800 uppercase leading-none">${safeName}</p>
                            <p class="text-[11px] font-semibold mt-1 ${p.confirmado ? 'text-green-600' : 'text-orange-500'}">
                                ${p.confirmado ? '✓ PAGADO' : 'PENDIENTE'}
                            </p>
                        </div>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="toggleConfirm(${idx})" class="p-2 rounded-lg ${p.confirmado ? 'text-green-600' : 'text-gray-400'} hover:bg-green-50 transition-all">✓</button>
                        <button onclick="openEdit(${idx})" class="p-2 text-gray-400 hover:text-blue-600 transition-all">✎</button>
                        <button onclick="deletePlayer(${idx})" class="p-2 text-gray-400 hover:text-red-500 transition-all">✕</button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function updateJerseySelect() {
            const select = document.getElementById('jersey-player-select');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Elige un jugador...</option>';
            players.forEach(p => {
                const opt = document.createElement('option');
                const safeName = p.nombre || 'SIN NOMBRE';
                opt.value = p.numero;
                opt.innerText = `#${p.numero} ${safeName.toUpperCase()}`;
                select.appendChild(opt);
            });
            select.value = currentVal;
        }

        // =======================================================================
        // 3. RENDERIZADO DE CAMISETA (Lógica Visual)
        // =======================================================================
        function transformName(name) {
            if (!name) return '';
            const n = name.toLowerCase().trim();
            if (n === 'aka') return 'AK';
            if (n.includes('novi')) return 'novi';
            if (n.includes('mike')) return 'mike';
            return name.toUpperCase();
        }

        function updateJerseyDisplay(playerNum) {
            const player = players.find(p => String(p.numero) === String(playerNum));
            const controls = document.getElementById('jersey-controls');
            const frontGroup = document.getElementById('front-text-group');
            const backGroup = document.getElementById('back-text-group');
            
            if (!player) {
                controls.classList.add('hidden');
                frontGroup.innerHTML = '';
                backGroup.innerHTML = '';
                return;
            }

            currentJerseyPlayer = player;
            controls.classList.remove('hidden');
            document.getElementById('preview-text-label').innerText = transformName(player.nombre);

            // TEXTO FRENTE
            const is420 = String(player.numero) === '420';
            const fSize = is420 ? 300 : 390;
            const fLen = is420 ? 480 : '';

            frontGroup.innerHTML = `
                <text x="872" y="1362" font-size="${fSize}" ${fLen ? `textLength="${fLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="white" stroke="white" stroke-width="43" stroke-join="round" paint-order="stroke">${player.numero}</text>
                <text x="872" y="1362" font-size="${fSize}" ${fLen ? `textLength="${fLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="black" stroke="black" stroke-width="27" stroke-join="round" paint-order="stroke">${player.numero}</text>
                <text x="872" y="1362" font-size="${fSize}" ${fLen ? `textLength="${fLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="white">${player.numero}</text>
            `;

            // TEXTO ESPALDA
            const bSize = is420 ? 420 : 625;
            const bLen = is420 ? 650 : '';
            const tName = transformName(player.nombre);

            // Ajustes estrictos de tamaño para nombres en la espalda (Ej: SEBASTIÁN)
            let nameFontSize = 200;
            let nameTextLength = '';
            
            if (tName.length >= 9) { // Nombres muy largos 
                nameFontSize = 130; 
                nameTextLength = 'textLength="700" lengthAdjust="spacingAndGlyphs"'; 
            } else if (tName.length >= 7) { // Nombres moderadamente largos
                nameFontSize = 160; 
                nameTextLength = 'textLength="800" lengthAdjust="spacingAndGlyphs"'; 
            }

            backGroup.innerHTML = `
                <path id="name-path-h" d="M 320,740 Q 873,518 1426,740" fill="none" />
                <text font-size="${nameFontSize}" fill="white">
                    <textPath href="#name-path-h" startOffset="50%" text-anchor="middle" ${nameTextLength}>${tName}</textPath>
                </text>
                <text x="873" y="1067" font-size="${bSize}" ${bLen ? `textLength="${bLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="white" stroke="white" stroke-width="56" stroke-join="round" paint-order="stroke">${player.numero}</text>
                <text x="873" y="1067" font-size="${bSize}" ${bLen ? `textLength="${bLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="black" stroke="black" stroke-width="34" stroke-join="round" paint-order="stroke">${player.numero}</text>
                <text x="873" y="1067" font-size="${bSize}" ${bLen ? `textLength="${bLen}" lengthAdjust="spacingAndGlyphs"` : ''} fill="white">${player.numero}</text>
            `;
        }

        async function downloadJersey(type) {
            const svg = document.getElementById(type === 'FRONT' ? 'svg-front' : 'svg-back');
            const canvas = document.createElement('canvas');
            canvas.width = 1745;
            canvas.height = 3538;
            const ctx = canvas.getContext('2d');
            
            const xml = new XMLSerializer().serializeToString(svg);
            const svg64 = btoa(unescape(encodeURIComponent(xml)));
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + svg64;
            
            img.onload = () => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const url = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `BGC_${currentJerseyPlayer.nombre.toUpperCase()}_${currentJerseyPlayer.numero}_${type}.png`;
                link.href = url;
                link.click();
            };
        }

        // --- Interaction ---
        document.getElementById('add-form').onsubmit = async (e) => {
            e.preventDefault();
            const n = document.getElementById('new-number').value;
            const m = document.getElementById('new-name').value;
            if (players.some(p => String(p.numero) === String(n))) return alert('Número ocupado');
            
            players.push({ numero: n, nombre: m, confirmado: false });
            document.getElementById('add-form').reset();
            renderPlayers();
            updateJerseySelect();
            
            await runAction('add', { numero: n, nombre: m });
        };

        async function toggleConfirm(idx) {
            const p = players[idx];
            p.confirmado = !p.confirmado;
            renderPlayers(); 
            
            const action = p.confirmado ? 'confirm' : 'unconfirm';
            await runAction(action, { numero: p.numero, nombre: p.nombre });
        }

        async function deletePlayer(idx) {
            if (!confirm('¿Eliminar jugador de la base de datos?')) return;
            const p = players[idx];
            players.splice(idx, 1);
            renderPlayers();
            updateJerseySelect();
            
            await runAction('delete', { numero: p.numero, nombre: p.nombre });
        }

        function openEdit(idx) {
            document.getElementById('edit-index').value = idx;
            document.getElementById('edit-number').value = players[idx].numero;
            document.getElementById('edit-name').value = players[idx].nombre;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        document.getElementById('edit-form').onsubmit = async (e) => {
            e.preventDefault();
            const idx = document.getElementById('edit-index').value;
            const newNum = document.getElementById('edit-number').value;
            const newName = document.getElementById('edit-name').value;
            
            const p = players[idx];
            const oldNumero = p.numero;
            const oldNombre = p.nombre;
            
            p.numero = newNum;
            p.nombre = newName;
            closeEditModal();
            renderPlayers();
            updateJerseySelect();
            
            await runAction('edit', { 
                oldNumero: oldNumero, 
                oldNombre: oldNombre, 
                newNumero: newNum, 
                newNombre: newName 
            });
        };

        document.getElementById('jersey-player-select').onchange = (e) => {
            updateJerseyDisplay(e.target.value);
        };
    </script>
</body>
</html>
